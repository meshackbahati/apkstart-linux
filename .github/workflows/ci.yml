name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Unit tests and CLI smoke (Linux / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

      - name: Check helper scripts
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/translate-key2touch.py

      # The documentation screenshots are built from the real renderer with a
      # stubbed IPC bridge, so a broken UI control is caught without Electron.
      - name: Build UI screenshot fixture
        run: |
          npm run docs:fixture
          test -s test/out/ui-fixture/stub.js
          test -s test/out/ui-fixture/index.html

      # The CLI must work without Electron, a running runtime or root access.
      - name: CLI smoke
        run: |
          node bin/apkstart.js --version
          node bin/apkstart.js --help
          node bin/apkstart.js init --check
          node bin/apkstart.js --list
