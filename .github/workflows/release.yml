name: Release

# Linux-first release pipeline for ApkStart Linux. Every release is gated on
# the full Node suite, the UI screenshot fixture and a checksum manifest; a tag
# is required before any asset is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.6.5'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Linux / Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Shell and Python helper syntax
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/translate-key2touch.py

      - name: UI screenshot fixture
        run: |
          npm run docs:fixture
          test -f test/out/ui-fixture/stub.js
          test -f test/out/ui-fixture/index.html

      - name: CLI smoke
        run: |
          node bin/apkstart.js --version
          node bin/apkstart.js --help
          node bin/apkstart.js init --check
          node bin/apkstart.js --list

  build-linux:
    name: Build Linux packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run pack:linux

      - name: Build Debian package
        run: npx electron-builder --linux deb --publish never --config electron-builder.yml

      - name: Generate checksums
        shell: bash
        run: |
          # Store bare file names so `sha256sum -c` works after the artifact
          # has been downloaded into a different directory.
          (cd dist/release && sha256sum *.AppImage *.deb) > SHA256SUMS
          cat SHA256SUMS

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" || {
            echo "Tag $tag does not match package.json $version" >&2
            exit 1
          }

      - name: Stage release assets
        shell: bash
        run: |
          # Upload from one directory so the artifact downloads flat; keeping
          # dist/release in the paths makes the checksum step look in a
          # subdirectory that does not exist after download.
          mkdir -p release-assets
          cp dist/release/*.AppImage dist/release/*.deb SHA256SUMS release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apkstart-linux-packages
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: apkstart-linux-packages
          path: release-assets

      - name: Verify checksums before publishing
        shell: bash
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          notes=".github/release-notes-$tag.md"
          args=()
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ApkStart Linux $tag" "${args[@]}"
          fi
          for asset in release-assets/*.AppImage release-assets/*.deb release-assets/SHA256SUMS; do
            [ -f "$asset" ] || continue
            gh release upload "$tag" "$asset" --clobber
          done
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
